<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Clientes - Baozi Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" media="all" href="../../css/listas-cadastros.css">
    <link href="/webjars/bootstrap/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>

    <header class="cabecalho">
        <h1 class="logo">Baozi <span class="destaque">Store</span></h1>
    </header>

    <main class="container-list">
        <section class="card">
        	<div class="acoes form-acoes mt-4">
                <a th:href="@{/}" class="btn btn-secundario text-center" style="text-decoration: none; width: 190px; display: block; margin-bottom: 25px;">Voltar para o Início</a>
            </div>
            <div class="card-header d-flex justify-content-between align-items-center">
                <div>
                    <h2>Clientes Cadastrados</h2>
                    <p>Histórico de clientes da loja.</p>
                </div>
                
            </div>
            
            <div class="table-responsive">
                <table class="table custom-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Cliente Desde</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="cliente : ${clientes}">
                            <td th:text="${cliente.id}">1</td>
                            <td th:text="${cliente.nome}">Exemplo Nome</td>
                            <td th:text="${cliente.clienteDesde}">2026-11-06</td>
                            <td>
                                <!-- Formulário para exclusão chamando o endpoint DELETE/POST -->
                                <form th:action="@{/clientes/deletar/{id}(id=${cliente.id})}" method="POST" style="display:inline;">
                                    <button type="submit" class="btn-acao btn-excluir">Excluir</button>
                                </form>
                            </td>
                        </tr>
                        <!-- Mensagem caso a lista esteja vazia -->
                        <tr th:if="${#lists.isEmpty(clientes)}">
                            <td colspan="4" class="text-center text-muted py-4">Nenhum cliente cadastrado.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            
        </section>
    </main>

</body>
</html>
