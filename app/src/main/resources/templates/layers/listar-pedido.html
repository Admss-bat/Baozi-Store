<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Pedidos - Baozi Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" media="all" href="../../css/listas-cadastros.css">
    <link href="/webjars/bootstrap/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>

    <header class="cabecalho">
        <h1 class="logo">Baozi <span class="destaque">Store</span></h1>
    </header>

    <main class="container-list">
        <section class="card">
        	<div class="acoes form-acoes mt-4">
                <a th:href="@{/}" class="btn btn-secundario text-center" style="text-decoration: none;  width: 190px; display: block; margin-bottom: 25px;">Voltar para o Início</a>
            </div>
            <div class="card-header d-flex justify-content-between align-items-center">
                <div>
                    <h2>Pedidos Registrados</h2>
                    <p>Histórico de pedidos realizados.</p>
                </div>
               
            </div>
            
            <div class="table-responsive">
                <table class="table custom-table">
                    <thead>
                        <tr>
                            <th>ID do Pedido</th>
                            <th>ID do Cliente</th>
                            <th>ID do Produto</th>
                            <th>Quantidade</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="pedido : ${pedidos}">
                            <td th:text="${pedido.id}">1</td>
                            <td th:text="${pedido.clienteId}">1</td>
                            <td th:text="${pedido.produtoId}">3</td>
                            <td th:text="${pedido.quantidade}">5</td>
                            <td>
                                <form th:action="@{/pedidos/deletar/{id}(id=${pedido.id})}" method="POST" style="display:inline;">
                                    <button type="submit" class="btn-acao btn-excluir">Excluir</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(pedidos)}">
                            <td colspan="5" class="text-center text-muted py-4">Nenhum pedido registrado.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            
        </section>
    </main>

</body>
</html>
