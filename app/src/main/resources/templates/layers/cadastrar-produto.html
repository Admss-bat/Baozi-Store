<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Produto
Baozi Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" media="all" href="../../css/form-menu-cadastro.css">
    <link href="/webjars/bootstrap/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>

    <header class="cabecalho">
        <h1 class="logo">Baozi <span class="destaque">Store</span></h1>
    </header>

    <main class="container-form">
        <section class="card">
            <div class="card-header texto-centro">
                <h2>Cadastrar Produto</h2>
                <p>Adicione um novo item ao cardápio da loja.</p>
            </div>
            
            <form action="/cadastrar-produto/salvar" method="POST">
                <div class="input-group">
                    <label for="nome">Nome do Produto</label>
                    <input type="text" id="nome" name="nome" placeholder="Ex: Pão Chinês Tradicional" required>
                </div>

                <div class="input-group">
                    <label for="preco">Preço (R$)</label>
                    <input type="number" step="0.01" id="preco" name="preco" placeholder="Ex: 8.50" required>
                </div>

                <div class="input-group">
                    <label for="estoque">Disponível em Estoque?</label>
                    <select id="estoque" name="estoque" required>
                        <option value="true">Sim</option>
                        <option value="false">Não</option>
                    </select>
                </div>

                <div class="acoes form-acoes">
                    <a th:href="@{/}" class="btn btn-secundario text-center" style="text-decoration: none; display: flex; justify-content: center; align-items: center;">Voltar</a>
                    <button type="submit" class="btn btn-primario">Salvar Produto</button>
                </div>
            </form>
        </section>
    </main>

</body>
</html>
