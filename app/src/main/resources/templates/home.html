<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" >
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baozi Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" media="all" href="../../css/style.css">
    <link href="/webjars/bootstrap/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>

    <header class="cabecalho">
        <h1 class="logo">Baozi <span class="destaque">Store</span></h1>
    </header>

    <main class="container">
        <!-- Balão 1: Clientes -->
        <section class="card">
            <div class="card-header">
                <h2>Clientes</h2>
                <p>Gerencie o cadastro de clientes.</p>
            </div>
            <div class="acoes">
                <a th:href="@{layers/cadastrar-cliente}"><button class="btn btn-primario">Cadastrar</button></a>
                <a th:href="@{layers/listar-clientes}"><button class="btn btn-secundario">Consultar</button></a>
            </div>
        </section>

        <!-- Balão 2: Produtos -->
        <section class="card">
            <div class="card-header">
                <h2>Produtos</h2>
                <p>Gerencie os itens da loja.</p>
            </div>
            <div class="acoes">
                <a th:href="@{layers/cadastrar-produto}"><button class="btn btn-primario">Cadastrar</button></a>
                <a th:href="@{layers/listar-produto}"><button class="btn btn-secundario">Consultar</button></a>
            </div>
        </section>

        <!-- Balão 3: Pedidos -->
        <section class="card">
            <div class="card-header">
                <h2>Pedidos</h2>
                <p>Gerencie os pedidos.</p>
            </div>
            <div class="acoes">
                <a th:href="@{layers/cadastrar-pedido}"><button class="btn btn-primario">Cadastrar</button></a>
                <a th:href="@{layers/listar-pedido}"><button class="btn btn-secundario">Consultar</button></a>
            </div>
        </section>

        <!-- Balão 4: Visualizar tudo -->
        <section class="card destaque-card">
            <div class="card-header">
                <h2>Visualizar tudo</h2>
                <p>Visualize todos os clientes, produtos e pedidos.</p>
            </div>
            <div class="acoes">
                <a th:href="@{layers/listar-tudo}"><button class="btn btn-primario btn-largo">Listar</button></a>
            </div>
        </section>
    </main>

</body>
</html>
