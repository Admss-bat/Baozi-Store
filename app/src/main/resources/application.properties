spring.application.name=app

# Configuração do Banco em Memória H2
spring.datasource.url=jdbc:h2:file:./data/baozi_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=senha123

# Dialeto JPA para H2 e criação automática de tabelas
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Habilita o console visual do H2 no navegador (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console